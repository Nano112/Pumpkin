[package]
name = "pumpkin-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["query"]
serverbound = []
clientbound = []
query = []

[dependencies]
pumpkin-nbt.workspace = true
pumpkin-data = { workspace = true, features = ["packet", "item_id_remap", "entity_id_remap", "sound_id_remap", "recipes", "bedrock_creative"] }
pumpkin-macros.workspace = true
pumpkin-world.workspace = true
pumpkin-util.workspace = true
serde = { workspace = true, features = ["derive"] }

uuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true

# encryption
aes.workspace = true
cfb8.workspace = true
ctr.workspace = true
sha2.workspace = true
hybrid-array = "0.4"

# compression
async-compression = { workspace = true, features = ["tokio", "zlib", "deflate"] }
flate2.workspace = true

bitflags.workspace = true

# lantern: "net" (mio) does not exist on wasm; only the Bedrock UDP path needs it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
# Validate correctness

[lints]
workspace = true
